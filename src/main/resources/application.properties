spring.application.name=smart-parking-lot

spring.datasource.url=jdbc:h2:mem:parkingdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Fee configuration
parking.fee.grace-minutes=15
parking.fee.rate.motorcycle=10
parking.fee.rate.car=20
parking.fee.rate.bus=50
